strategy:
  themes:
    - name: semis
      label: 半導体
      keywords: ["semiconductor","chip","wafer","foundry","fab","SOX"]
    - name: ai_infra
      label: AIインフラ
      keywords: ["datacenter","gpu","accelerator","cloud capex","AI infrastructure"]
    - name: rare_metals
      label: レアメタル
      keywords: ["copper","lithium","nickel","rare earth","gallium"]
    - name: robotics
      label: ロボティクス
      keywords: ["robot","automation","factory automation","logistics automation"]
  weights:
    meta: 0.40
    tech: 0.30
    event: 0.20
    macro: 0.10
  mode: normal  # normal or return_first (攻撃型：加速を強く優先)
risk:
  dd_warn: -0.10
  dd_stop: -0.15
  max_weight: 0.20
acceleration:
  enabled: true
  breakout_days: 60        # ブレイクアウト判定期間
  volume_multiplier: 1.5   # 出来高異常の倍率
  max_volatility: 0.03     # 許容ボラティリティ（日次標準偏差）
  weights:
    breakout: 40           # ブレイクアウトの重み
    volume: 30             # 出来高の重み
    momentum: 30           # モメンタムの重み
  score_impact: 10         # スコアへの最大影響（0-10点）
learn:
  enabled: true            # 学習レイヤーの有効化
  mode: shadow             # shadow固定（本番環境には影響しない）
  max_delta: 0.10          # 週次最大変更幅（10%）
  window_weeks: 52         # 評価期間（週）
  bounds:
    min: 0.10              # テーマ重みの下限
    max: 0.50              # テーマ重みの上限
  objective: return_first  # return_first or sharpe
regime:
  enabled: true                # レジーム判定を有効化
  threshold_on: 2              # RISK_ONになる閾値
  threshold_off: -2            # RISK_OFFになる閾値
  use_vix: true                # VIXを使用（取得失敗時は影響なし）
  use_tnx: true                # 10年債金利を使用
  use_usdjpy: true             # USD/JPYを使用
  window_weeks_ma: 40          # 移動平均の週数（200日≒40週）
  vix_threshold: 25            # VIXの警戒閾値
  rate_shock_weeks: 4          # 金利急変判定の週数
  rate_shock_threshold: 0.5    # 金利変化の閾値
  fx_shock_weeks: 4            # 為替急変判定の週数
  fx_shock_threshold: 5.0      # 為替変化率の閾値（%）
execution:
  etf_monthly_jpy: 15000
  etf_sp500_jpy: 10000
  etf_topix_jpy: 5000
  stock_monthly_jpy: 5000
  extra_cash_jpy: 0
